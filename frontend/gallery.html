<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>By The Way Cafe | Gallery</title>
 
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
     
        .gallery-img {
            height: 200px; 
            object-fit: cover;
            transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .gallery-img:hover {
            transform: scale(1.05); 
            opacity: 0.9;
            filter: brightness(1.15);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="menu.html">Menu</a> | 
            <a href="promotion.html">Promotion</a> | <a href="catering.html">Catering</a> | 
            <a href="gallery.html">Gallery</a> | <a href="review.html">Review</a> | <a href="careers.html">Careers</a> | 
            <a href="faq.html">FAQ</a> | <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    
    <main>

        <div class="hero-banner">
            <img src="media/logo.png" alt="By The Way Cafe Logo">
            <div class="hero-text">
                <h1>By The Way Cafe</h1>
                <p class="tagline">by the way, just be your own way</p>
            </div>
            <div class="status-widget">
                <div id="live-clock">--:--:--</div>
                <div id="shop-status">● Loading time...</div>
            </div>
        </div>

        <div style="margin-top: 40px;">
            <h2>Our Gallery</h2>
            <p>Take a look at our gallery:</p>
        </div>

        <div class="gallery-container">
            <img src="media/chickenchop.png" alt="Chicken Chop" class="gallery-img">
            <img src="media/drink.png" alt="Drink" class="gallery-img">
            <img src="media/outdoor.png" alt="Outdoor" class="gallery-img">
            
            <video controls class="gallery-img">
                <source src="media/video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <video controls class="gallery-img">
                <source src="media/video 2.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

    </main>
    
    <footer>
        <p>&copy; 2026 By The Way Cafe. All Rights Reserved.</p>
    </footer>
    <script src="script/clock.js"></script>

</body>

</html>
