<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>By The Way Cafe | Review</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .hero-banner {
            background-color: #FFFACD;
            padding: 40px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .hero-banner img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .hero-text h1 {
            margin: 0 0 8px 0;
            font-size: 2.5rem;
        }

        .hero-text .tagline {
            margin: 0;
            font-size: 18px;
            font-style: italic;
            color: #d9381e;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="menu.html">Menu</a> | <a
                href="promotion.html">Promotion</a> | <a href="catering.html">Catering</a> | <a
                href="gallery.html">Gallery</a> | <a href="review.html">Review</a> | <a href="careers.html">Careers</a>
            | <a href="faq.html">FAQ</a> | <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero-banner">
            <img src="media/logo.png" alt="By The Way Cafe Logo">
            <div class="hero-text">
                <h1>By The Way Cafe</h1>
                <p class="tagline">by the way, just be your own way</p>
            </div>
        </div>
        <h2>Customer Reviews</h2>
        <p>Please leave a rating after dining at By The Way Cafe.</p>
        <form action="https://bythewaycafe.infinityfree.io/review_insert.php" method="POST">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Ali bin Abu" minlength="3" maxlength="50"
                required><br><br>

            <label for="rating">Rating:</label><br>
            <select id="rating" name="rating" required>
                <option value="">-- Select Rating --</option>
                <option value="1">1 star</option>
                <option value="2">2 star</option>
                <option value="3">3 star</option>
                <option value="4">4 star</option>
                <option value="5">5 star</option>
            </select><br><br>


            <label for="comment">Comment:</label><br>
            <textarea id="comment" name="comment" rows="5" minlength="10" maxlength="500" required></textarea><br><br>

            <input type="submit" value="Submit">

        </form>

    </main>
    <footer>
        <p>&copy; 2026 By The Way Cafe. All Rights Reserved.</p>
    </footer>
</body>

</html>
