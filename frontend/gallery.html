<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>By The Way Cafe | Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .hero-banner {
            background-color: #FFFACD;
            padding: 40px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .hero-banner img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .hero-text h1 {
            margin: 0 0 8px 0;
            font-size: 2.5rem;
        }

        .hero-text .tagline {
            margin: 0;
            font-size: 18px;
            font-style: italic;
            color: #d9381e;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-grid img,
        .gallery-grid video {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .gallery-grid img:hover,
        .gallery-grid video:hover {
            transform: scale(1.02);
            opacity: 0.85;
            filter: brightness(1.15);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="menu.html">Menu</a> | <a
                href="promotion.html">Promotion</a> | <a href="catering.html">Catering</a> | <a
                href="gallery.html">Gallery</a> | <a href="review.html">Review</a> | <a href="careers.html">Careers</a>
            | <a href="faq.html">FAQ</a> | <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero-banner">
            <img src="media/logo.png" alt="By The Way Cafe Logo">
            <div class="hero-text">
                <h1>By The Way Cafe</h1>
                <p class="tagline">by the way, just be your own way</p>
            </div>
        </div>

        <h2>Our Gallery</h2>
        <p>Take a look at our gallery:</p>
 <div class="container">
        <h1>Gallery</h1>
        <div class="clearfix">
            <img src="media/chickenchop.png" alt="Chicken Chop">
            <img src="media/drink.png" alt="drink">
            <img src="media/outdoor.png" alt="Outdoor">
            
            <video controls>
                <source src="media/video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <video controls>
                <source src="media/video 2.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
 </div>


    </main>
    <footer>
        <p>&copy; 2026 By The Way Cafe. All Rights Reserved.</p>
    </footer>
</body>

</html>
